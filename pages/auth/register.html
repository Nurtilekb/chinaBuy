<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - ChinaBuy Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../src/css/main.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            background: var(--color-gray-50);
        }
        
        .auth-left {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-16);
            background: linear-gradient(135deg, var(--color-primary-600) 0%, var(--color-primary-700) 100%);
            position: relative;
            overflow: hidden;
        }
        
        .auth-left::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -200px;
            right: -200px;
        }
        
        .auth-left-content {
            max-width: 400px;
            color: var(--color-white);
            position: relative;
            z-index: 10;
        }
        
        .auth-left h1 {
            font-size: var(--font-size-4xl);
            font-weight: var(--font-weight-bold);
            margin-bottom: var(--spacing-4);
            line-height: var(--line-height-tight);
        }
        
        .auth-left p {
            font-size: var(--font-size-lg);
            opacity: 0.9;
            line-height: var(--line-height-relaxed);
        }
        
        .auth-right {
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-16);
            background: var(--color-white);
        }
        
        .auth-form-container {
            width: 100%;
            max-width: 400px;
        }
        
        .auth-logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-3);
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-gray-900);
            margin-bottom: var(--spacing-12);
        }
        
        .auth-title {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-gray-900);
            margin-bottom: var(--spacing-2);
        }
        
        .auth-subtitle {
            font-size: var(--font-size-base);
            color: var(--color-gray-500);
            margin-bottom: var(--spacing-8);
        }
        
        .social-login {
            display: flex;
            gap: var(--spacing-3);
            margin-bottom: var(--spacing-8);
        }
        
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-2);
            padding: var(--spacing-3);
            background: var(--color-white);
            border: 1.5px solid var(--color-gray-300);
            border-radius: var(--radius-xl);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            color: var(--color-gray-700);
            transition: all var(--transition-fast);
        }
        
        .social-btn:hover {
            border-color: var(--color-gray-400);
            background: var(--color-gray-50);
        }
        
        .divider {
            display: flex;
            align-items: center;
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-8);
            color: var(--color-gray-400);
            font-size: var(--font-size-sm);
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-gray-200);
        }
        
        .form-footer {
            text-align: center;
            margin-top: var(--spacing-8);
            font-size: var(--font-size-sm);
            color: var(--color-gray-600);
        }
        
        .form-footer a {
            color: var(--color-primary-600);
            font-weight: var(--font-weight-semibold);
        }
        
        .form-footer a:hover {
            text-decoration: underline;
        }
        
        .terms-label {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-2);
            margin-bottom: var(--spacing-6);
            font-size: var(--font-size-sm);
            color: var(--color-gray-600);
        }
        
        .terms-label input {
            width: 18px;
            height: 18px;
            accent-color: var(--color-primary-600);
            margin-top: 2px;
        }
        
        .terms-label a {
            color: var(--color-primary-600);
            font-weight: var(--font-weight-medium);
        }
        
        .password-strength {
            margin-top: var(--spacing-2);
            height: 4px;
            background: var(--color-gray-200);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all var(--transition-normal);
            border-radius: 2px;
        }
        
        .password-strength-bar.weak { width: 33%; background: var(--color-error-500); }
        .password-strength-bar.medium { width: 66%; background: var(--color-warning-500); }
        .password-strength-bar.strong { width: 100%; background: var(--color-success-500); }
        
        .password-hints {
            font-size: var(--font-size-xs);
            color: var(--color-gray-500);
            margin-top: var(--spacing-2);
        }
        
        @media (max-width: 1024px) {
            .auth-left {
                display: none;
            }
            
            .auth-right {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-left">
            <div class="auth-left-content">
                <h1>Начните экономить уже сегодня</h1>
                <p>Присоединяйтесь к 50,000+ предпринимателей, которые закупаются в Китае выгодно</p>
            </div>
        </div>
        
        <div class="auth-right">
            <div class="auth-form-container">
                <a href="../../index.html" class="auth-logo">
                    <span class="logo-icon">📦</span>
                    <span class="logo-text">ChinaBuy<span class="logo-accent">Pro</span></span>
                </a>
                
                <h2 class="auth-title">Создать аккаунт</h2>
                <p class="auth-subtitle">Зарегистрируйтесь для доступа ко всем функциям</p>
                
                <div class="social-login">
                    <button class="social-btn" onclick="handleSocialRegister('google')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Google
                    </button>
                    <button class="social-btn" onclick="handleSocialRegister('apple')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-.8 1.94-.8s.16 1.37-.73 2.49c-.89 1.13-2.36.99-2.36.99s-.15-1.41.73-2.68z"/>
                        </svg>
                        Apple
                    </button>
                </div>
                
                <div class="divider">или через email</div>
                
                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="fullName">ФИО</label>
                        <input type="text" id="fullName" class="form-input" placeholder="Иван Петров" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="phone">Телефон</label>
                        <input type="tel" id="phone" class="form-input" placeholder="+7 (999) 000-00-00">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">Пароль</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="8">
                        <div class="password-strength">
                            <div class="password-strength-bar" id="strengthBar"></div>
                        </div>
                        <div class="password-hints">Минимум 8 символов, заглавная буква и цифра</div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Подтверждение пароля</label>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
                    </div>
                    
                    <label class="terms-label">
                        <input type="checkbox" id="terms" required>
                        <span>Я согласен с <a href="#">условиями сервиса</a> и <a href="#">политикой конфиденциальности</a></span>
                    </label>
                    
                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
                        Создать аккаунт
                    </button>
                </form>
                
                <div class="form-footer">
                    Уже есть аккаунт? <a href="login.html">Войти</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../../src/js/main.js"></script>
    <script>
        // Password strength checker
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');
        
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            strengthBar.className = 'password-strength-bar';
            if (strength <= 1) strengthBar.classList.add('weak');
            else if (strength <= 2) strengthBar.classList.add('medium');
            else if (strength >= 3) strengthBar.classList.add('strong');
        });
        
        // Form validation and submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            
            let isValid = true;
            
            // Validate full name
            if (fullName.length < 2) {
                FormUtils.showError(document.getElementById('fullName'), 'Введите корректное ФИО');
                isValid = false;
            }
            
            // Validate email
            if (!FormUtils.validateEmail(email)) {
                FormUtils.showError(document.getElementById('email'), 'Введите корректный email');
                isValid = false;
            }
            
            // Validate password
            if (!FormUtils.validatePassword(password)) {
                FormUtils.showError(document.getElementById('password'), 'Пароль должен быть не менее 8 символов');
                isValid = false;
            }
            
            // Validate password match
            if (password !== confirmPassword) {
                FormUtils.showError(document.getElementById('confirmPassword'), 'Пароли не совпадают');
                isValid = false;
            }
            
            // Validate terms
            if (!terms) {
                alert('Необходимо принять условия сервиса');
                isValid = false;
            }
            
            if (isValid) {
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> Создание аккаунта...';
                
                // Simulate API call
                setTimeout(() => {
                    // Store user data (in real app, this would be an API call)
                    localStorage.setItem('user', JSON.stringify({
                        email: email,
                        fullName: fullName,
                        phone: phone
                    }));
                    
                    Notification.show('Аккаунт успешно создан!', 'success');
                    setTimeout(() => {
                        window.location.href = '../dashboard/dashboard.html';
                    }, 1000);
                }, 1500);
            }
        });
        
        // Social registration handler
        function handleSocialRegister(provider) {
            Notification.show(`Переход к авторизации через ${provider}...`, 'info');
            // In real app, redirect to OAuth provider
        }
        
        // Clear errors on input
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('input', function() {
                FormUtils.clearError(this);
            });
        });
    </script>
</body>
</html>
