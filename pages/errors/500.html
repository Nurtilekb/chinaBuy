<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Ошибка сервера | ChinaBuy Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../src/css/main.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-gray-50);
            padding: var(--spacing-8);
        }
        
        .error-content {
            text-align: center;
            max-width: 500px;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: var(--font-weight-bold);
            color: var(--color-error-200);
            line-height: 1;
            margin-bottom: var(--spacing-4);
        }
        
        .error-icon {
            font-size: 80px;
            margin-bottom: var(--spacing-6);
        }
        
        .error-title {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-gray-900);
            margin-bottom: var(--spacing-4);
        }
        
        .error-message {
            font-size: var(--font-size-lg);
            color: var(--color-gray-600);
            margin-bottom: var(--spacing-8);
            line-height: var(--line-height-relaxed);
        }
        
        .error-actions {
            display: flex;
            gap: var(--spacing-4);
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <div class="error-code">500</div>
            <div class="error-icon">⚠️</div>
            <h1 class="error-title">Ошибка сервера</h1>
            <p class="error-message">
                Произошла непредвиденная ошибка на нашей стороне. Мы уже работаем над решением проблемы.
            </p>
            <div class="error-actions">
                <a href="../../index.html" class="btn btn-primary btn-lg">
                    🏠 На главную
                </a>
                <button onclick="location.reload()" class="btn btn-outline btn-lg">
                    🔄 Обновить страницу
                </button>
            </div>
        </div>
    </div>
</body>
</html>
